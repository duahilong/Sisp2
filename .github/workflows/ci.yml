name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -r requirements-gui.txt

      - name: Ruff
        run: python -m ruff check app tests

      - name: Pytest with coverage
        run: python -m pytest -o addopts="" --cov=app --cov-report=term-missing --cov-fail-under=70

  build:
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build with PyInstaller spec
        run: python -m PyInstaller --clean --noconfirm Sisp.spec

  build-gui:
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -r requirements-gui.txt

      - name: Build GUI with PyInstaller spec
        run: python -m PyInstaller --clean --noconfirm SispGUI.spec
