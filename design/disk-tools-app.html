function bindWizard(){
  if (wz.step === 1){
    $$('#wzBody .dsel').forEach(el => el.addEventListener('click', () => {
      const id = +el.dataset.disk;
      if (el.dataset.no){
        const d = disk(id);
        toast(d.system ? '磁盘 0 是正在用的系统盘，不能覆盖' : '磁盘 2 是只读设备，不能写入');
        return;
      }
      if (tgtOf(id)) wz.targets = wz.targets.filter(t => t.diskId !== id);
      else addTarget(id);
      wz.ack = false;
      renderWizard();
    }));
    $$('#wzBody [data-sel]').forEach(b => b.addEventListener('click', () => {
      if (b.dataset.sel === 'none') wz.targets = [];
      else disks.filter(installable).forEach(d => addTarget(d.id));
      wz.ack = false;
      renderWizard();
    }));
  } else if (wz.step === 2){
    $$('#wzBody .szi').forEach(inp => {
      const id = +inp.dataset.disk;
      const kind = inp.dataset.kind;
      inp.addEventListener('input', () => {
        const t = tgtOf(id);
        if (!t) return;
        const v = inp.value === '' ? 0 : +inp.value;
        if (kind === 'sys') t.sys = v; else t.data = v;
        refreshTgt(id);
      });
    });
    $$('#wzBody [data-preset]').forEach(b => b.addEventListener('click', () => {
      const card = b.closest('.tgt');
      const id = +(b.dataset.disk || (card ? card.dataset.disk : 0));
      const t = tgtOf(id), d = disk(id);
      if (!t || !d) return;
      const key = b.dataset.preset;
      t.sys = key === 'half' ? Math.floor(d.total / 2) : Math.min(+key, Math.floor(d.total) - 20);
      t.data = Math.round((d.total - t.sys) * 10) / 10;
      $('#sys-' + id).value = t.sys;
      $('#dat-' + id).value = t.data;
      refreshTgt(id);
    }));
    wz.targets.forEach(t => { bindBar(t.diskId); refreshTgt(t.diskId); });
  } else if (wz.step === 3){
    $$('#wzBody .vchip').forEach(b => b.addEventListener('click', () => {
      const t = tgtOf(+b.dataset.vd);
      if (!t) return;
      t.version = b.dataset.ver;
      wz.ack = false;
      renderWizard();
    }));
  } else {
    const ack = $('#wzAck');
    if (ack) ack.addEventListener('change', () => {
      wz.ack = ack.checked;
      const bar = ack.closest('.ackbar');
      if (bar) bar.classList.toggle('on', ack.checked);
      updateFoot();
    });
    const st = $('#wzStart');
    if (st) st.addEventListener('click', () => { if (wz.ack) startInstall(); });
  }
}

function updateFoot(){
  const back = $('#wzBack'), next = $('#wzNext'), hint = $('#wzHint');
  if (!back || !next) return;
  next.style.display = '';
  if (wz.installing){
    back.disabled = true; next.disabled = true;
    next.textContent = '安装中…';
    return;
  }
  if (wz.finished){ back.disabled = true; next.disabled = false; next.textContent = '完成'; return; }
  back.disabled = wz.step === 1;
  next.textContent = wz.step === 4 ? '开始安装' : '下一步';
  hint.classList.remove('warn');
  if (wz.step === 1){
    next.disabled = !wz.targets.length;
    hint.textContent = wz.targets.length ? '已选 ' + wz.targets.length + ' 块磁盘，下一步分别设置' : '至少选一块硬盘';
  } else if (wz.step === 2){
    next.disabled = !allValid();
    hint.textContent = wz.targets.length > 1 ? '每块盘的两个分区都要填对' : '两个分区合计不能超过磁盘容量';
  } else if (wz.step === 3){
    next.disabled = !wz.targets.length;
    hint.textContent = '';
  } else {
    /* 第 4 步的主操作是页内那颗红色危险按钮，底部不再放一个同名按钮 */
    next.style.display = 'none';
    next.disabled = !wz.ack;
    hint.textContent = wz.ack ? '确认无误后，点下面的红色按钮开始' : '请先勾选确认项，再点红色按钮';
    hint.classList.toggle('warn', !wz.ack);
    const st = $('#wzStart');
    if (st) st.disabled = !wz.ack;
  }
}

/* ---------------- 开始安装 ---------------- */
function startInstall(){
  if (!allValid()){ wz.step = 2; renderWizard(); return; }
  wz.installing = true;

  const stages = ['检查镜像','重新分区','格式化分区','写入系统文件','配置启动项','收尾'];
  const lines = [];
  wz.targets.forEach(t => {
    const d = disk(t.diskId);
    const v = VERSIONS.find(x => x.id === t.version);
    const n = d.parts.filter(p => p.fs !== 'FREE').length;
    lines.push(['—— 磁盘 ' + d.id + '：' + v.name + ' ' + v.build.split(' · ')[0] + ' ——', 'hl']);
    lines.push(['锁定磁盘 ' + d.id + '，阻止其它程序访问', 'wn']);
    lines.push(['删除原有 ' + n + ' 个分区', 'wn']);
    lines.push(['创建 系统分区 C: ' + fmt(t.sys), '']);
    lines.push(['创建 数据分区 D: ' + fmt(t.data), '']);
    lines.push(['把 ' + v.name + ' 镜像写入磁盘 ' + d.id, '']);
  });
  lines.push(['更新启动菜单，登记全部系统', '']);
  lines.push(['移除安装介质，准备重启', '']);
  lines.push(['全部完成', 'hl']);

  $('#wzBody').innerHTML = `<div class="wp">
    <div class="prow"><span class="pname" id="wpName">${stages[0]}…</span>
      <span class="peta" id="wpEta">剩余时间 —</span></div>
    <div class="track"><i id="wpBar"></i></div>
    <ul class="stages" id="wpStages">
      ${stages.map((s,i) => `<li data-i="${i}"><span class="sk">${i+1}</span>${s}<span class="stt"></span></li>`).join('')}
    </ul>
    <div class="plog" id="wpLog"></div>
  </div>`;
  updateFoot();
  $('#wzHint').textContent = '安装过程中请不要关闭窗口';
  $('#wzHint').classList.remove('warn');

  const logEl = $('#wpLog');
  const stamp = () => {
    const t = new Date();
    return [t.getHours(), t.getMinutes(), t.getSeconds()].map(n => String(n).padStart(2,'0')).join(':');
  };
  const addLine = (text, cls) => {
    const div = document.createElement('div');
    if (cls) div.className = cls;
    div.innerHTML = '<span class="t">' + stamp() + '</span><span>' + text + '</span>';
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
  };
  addLine('开始安装：' + wz.targets.map(t => '磁盘 ' + t.diskId).join('、'), 'hl');

  let pct = 0, li = 0;
  const total = lines.length;
  wzTimer = setInterval(() => {
    pct = Math.min(100, pct + Math.random() * 5 + 2.5);
    const bar = $('#wpBar');
    if (!bar){ clearInterval(wzTimer); wzTimer = null; return; }
    bar.style.width = pct + '%';
    $('#wpEta').textContent = pct >= 100 ? '完成' : '剩余约 ' + Math.max(1, Math.round((100 - pct) / 100 * (wz.targets.length * 12))) + ' 秒';

    const step = Math.min(stages.length - 1, Math.floor(pct / 100 * stages.length));
    $$('#wpStages li').forEach((el, i) => {
      el.classList.toggle('done', i < step || pct >= 100);
      el.classList.toggle('on', i === step && pct < 100);
      el.querySelector('.stt').textContent = i < step || pct >= 100 ? '完成' : (i === step ? '进行中' : '等待');
    });
    $('#wpName').textContent = stages[step] + '…';

    if (li < total && Math.random() > 0.3){ addLine(lines[li][0], lines[li][1]); li++; }
    if (pct >= 100){
      clearInterval(wzTimer); wzTimer = null;
      while (li < total){ addLine(lines[li][0], lines[li][1]); li++; }
      setTimeout(finishInstall, 650);
    }
  }, 300);
}

function finishInstall(){
  const rows = wz.targets.map(t => {
    const d = disk(t.diskId);
    const v = VERSIONS.find(x => x.id === t.version);
    return `<tr><td class="k" style="width:64px">磁盘 ${d.id}</td>
      <td class="v">${v.name} ${v.build.split(' · ')[0]}　<span style="font-weight:400;color:var(--muted)">C: ${fmt(t.sys)} / D: ${fmt(t.data)}</span></td></tr>`;
  }).join('');
  commitInstall();
  wz.installing = false;
  wz.finished = true;
  $('#wzBody').innerHTML = `<div class="wz-inner" style="padding:26px 0 10px">
    <div style="font-size:15px;font-weight:600;margin-bottom:4px">全部装好了</div>
    <p class="wz-p">可以拔掉安装介质，重启这台电脑。第一次开机会慢一些，属于正常现象。</p>
    <div class="sum" style="max-width:520px"><table>${rows}</table></div>
  </div>`;
  updateFoot();
  $('#wzHint').textContent = '装完后这台电脑就可以正常开机了';
  toast('系统安装完成');
}

function commitInstall(){
  const stamp = Date.now();
  wz.targets.forEach((t, i) => {
    const d = disk(t.diskId);
    const v = VERSIONS.find(x => x.id === t.version);
    const rest = Math.round((d.total - t.sys - t.data) * 100) / 100;
    const parts = [
      { id:'s' + stamp + i, letter:'C:', label:'系统', fs:'NTFS', size:t.sys, type:'主分区', system:true },
      { id:'t' + stamp + i, letter:'D:', label:'数据', fs:'NTFS', size:t.data, type:'主分区' }
    ];
    if (rest > 0.05) parts.push({ id:'u' + stamp + i, letter:'', label:'', fs:'FREE', size:rest, type:'未分配' });
    d.parts = parts;
    d.table = 'GPT';
    d.os = v.name + ' ' + v.build.split(' · ')[0];
    log('磁盘 ' + d.id + ' 已安装 ' + d.os, 'ok');
  });
  const first = wz.targets[0];
  if (first){
    const d = disk(first.diskId);
    state.diskId = d.id;
    state.partId = d.parts.length ? d.parts[0].id : null;
  }
  renderAll();
}

/* ---------------- 视图切换：主页面 / 系统安装 / 设置 ---------------- */
function gotoView(nav){
  if (!nav || nav === view) return;
  if (wz.installing && nav !== 'install'){
    toast('正在写入磁盘，装完再切换页面');
    return;
  }
  if (nav === 'install'){ openWizard(); return; }

  /* 离开向导：只收起，进度保留 */
  if (view === 'install') leaveWizard();
  view = nav === 'settings' ? 'settings' : 'main';
  applyView();
  if (view === 'settings') renderSettings();
  log(view === 'settings' ? '打开设置' : '回到主页面');
}

$('#navseg').addEventListener('click', e => {
  const b = e.target.closest('button[data-nav]');
  if (b) gotoView(b.dataset.nav);
});

/* 设置页的保存 / 恢复默认 */
$('#setSave').addEventListener('click', () => saveSettings());
$('#setDefaults').addEventListener('click', () => {
  Object.assign(settings, SETTINGS_DEFAULTS);
  settingsDirty = true;
  saveSettings(true);
  renderSettings();
  toast('已恢复默认设置');
  log('设置已恢复默认', 'wn');
});

/* ---------------- 向导按钮 ---------------- */
$('#wzExit').addEventListener('click', () => {
  if (wz.installing){ toast('安装正在进行，不能返回'); return; }
  leaveWizard();
});
$('#wzReset').addEventListener('click', () => {
  if (wz.installing){ toast('安装正在进行，不能重置'); return; }
  resetWizardState();
  openWizard();
});
$('#wzNext').addEventListener('click', () => {
  if (wz.finished){ resetWizard(); return; }
  if (wz.installing) return;
  if (wz.step < 4){ wz.step++; renderWizard(); return; }
  startInstall();
});
$('#wzBack').addEventListener('click', () => {
  if (wz.installing || wz.finished) return;
  if (wz.step > 1){ wz.step--; renderWizard(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && wz.on && !wz.installing && !$('#overlay').classList.contains('on')) leaveWizard();
});

/* 初始化 */
renderAll();
log('就绪 · 检测到 ' + disks.length + ' 块磁盘', 'hl');
</script>
</body>
