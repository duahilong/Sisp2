[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sisp"
version = "0.2.0"
description = "Windows 系统安装辅助工具"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "wcwidth>=0.2.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
sisp = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [".git", "build", "dist", "__pycache__", ".pytest_cache", ".ruff_cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B904"]

[tool.ruff.lint.per-file-ignores]
"app/__init__.py" = ["F401"]
"app/main.py" = ["E402"]
"app/modules/*/__init__.py" = ["F401"]
"tests/*.py" = ["E402"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
